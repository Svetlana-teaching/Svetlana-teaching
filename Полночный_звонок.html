<style>
/* Layout: full-screen top-down house; menus look like a VHS tape cover over the dark hallway */

<script>
'use strict';
/* ================= DATA ================= */
const CHARS=[
 {id:'nika',fem:true,name:'Ника',role:'Спортсменка',desc:'Бегает быстрее и дольше не устаёт.',speed:1.15,stamina:1.5,lives:0,quiet:1,crouchVis:.55,search:1,glint:false,hair:'#d89a3a',skin:'#f2c9a5',shirt:'#e0454b',style:'pony'},
 {id:'den',fem:false,name:'Дэн',role:'Крепкий',desc:'Лишняя жизнь: может вырваться из рук убийцы ещё раз.',speed:1,stamina:1,lives:1,quiet:1,crouchVis:.55,search:1,glint:false,hair:'#3b2416',skin:'#e3b089',shirt:'#3a78d8',style:'short'},

];
const ITEMS={
 key:{name:'Ключ от входной двери',short:'ключ'},
 cutter:{name:'Кусачки, чтобы перекусить цепь',short:'кусачки'},
 fuse:{name:'Предохранитель для электрозамка',short:'предохранитель'},
 flash:{name:'Фонарик: видно дальше',short:'фонарик',bonus:true},
 cookie:{name:'Печенье: силы восстановлены',short:'печенье',bonus:true},
};
const DIFFS=[
 {id:'easy',name:'Лёгкий',note:'Один убийца, родители медленные',need:['key','cutter'],lives:3,spd:.82,sight:.8,killers:['fox'],delay:30,bias:.15},
 {id:'normal',name:'Нормальный',note:'Два убийцы и строгие родители',need:['key','cutter','fuse'],lives:2,spd:1,sight:1,killers:['fox','gardener'],delay:18,bias:.3},
 {id:'hard',name:'Кошмар',note:'Одна жизнь. Все охотятся сразу',need:['key','cutter','fuse'],lives:1,spd:1.15,sight:1.25,killers:['fox','gardener'],delay:4,bias:.5},
];
const FOES={
 fox:{name:'Человек в маске лиса',desc:'Быстрый. Ходит по всему дому',killer:true,walk:2.0,run:4.1,sight:7,hear:1},
 gardener:{name:'Садовник',desc:'Медленный, но слышит каждый шаг',killer:true,walk:1.5,run:3.5,sight:6,hear:2},
 mom:{name:'Злая мама',desc:'Поймает и отправит в комнату',killer:false,walk:1.7,run:3.1,sight:6,hear:1},
 dad:{name:'Злой папа',desc:'Отберёт найденную вещь',killer:false,walk:1.6,run:3.0,sight:6.5,hear:1},
};
const sel={ch:0,diff:1};

/* ================= UTIL ================= */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function fmt(t){const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;}
let rnd=Math.random;
const gv=(f,m)=>(G&&G.ch&&G.ch.fem)?f:m;

/* ================= HOUSE ================= */
const MW=32,MH=20;
const FURN={
 bed:{c:'#7c3b4a',hide:true,label:'кровать'},table:{c:'#7a5534',hide:true,label:'стол'},desk:{c:'#6b4a2c',hide:true,cont:true,label:'письменный стол'},
 sofa:{c:'#5a4a7a',cont:true,label:'диван (под подушками)'},wardrobe:{c:'#5b3e28',cont:true,label:'шкаф'},night:{c:'#6e4b2e',cont:true,label:'тумбочка'},
 fridge:{c:'#c9ccd1',cont:true,label:'холодильник'},counter:{c:'#8a6a48',cont:true,label:'кухонный шкафчик'},stove:{c:'#3a3b40',label:'плита'},
 shelf:{c:'#6b4a30',cont:true,label:'книжная полка'},bath:{c:'#d8dde3',label:'ванна'},toilet:{c:'#e6e9ee',label:'унитаз'},sinkc:{c:'#b9c0c8',cont:true,label:'шкафчик под раковиной'},
 tv:{c:'#1a1a1f',label:'телевизор'},car:{c:'#8c1d24',cont:true,label:'бардачок машины'},tools:{c:'#c0392b',cont:true,label:'ящик с инструментами'},
 plant:{c:'#2f6b34',label:'цветок'},dresser:{c:'#7a5233',cont:true,label:'комод'},boxes:{c:'#a8814f',cont:true,label:'коробки'},washer:{c:'#dfe3e8',cont:true,label:'стиральная машина'},
 chair:{c:'#6d4a7a',label:'кресло'},toybox:{c:'#d9a33a',cont:true,label:'ящик с игрушками'},buffet:{c:'#6a4426',cont:true,label:'буфет'},shoes:{c:'#6f5640',cont:true,label:'тумбочка для обуви'},
 coats:{c:'#4a3a30',cont:true,label:'шкаф с куртками'},basket:{c:'#b8955f',cont:true,label:'корзина с бельём'},aid:{c:'#e8e8e8',cont:true,label:'аптечка'},
};
function makeFloor(){return{t:new Array(MW*MH).fill('wall'),fl:new Array(MW*MH).fill(''),fu:new Array(MW*MH).fill(null),room:new Array(MW*MH).fill('')};}
function buildHouse(){
 const F=[makeFloor(),makeFloor()];
 const room=(f,x0,y0,x1,y1,fl,name)=>{for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*MW+x;F[f].t[i]='floor';F[f].fl[i]=fl;F[f].room[i]=name;}};
 const door=(f,x,y)=>{const i=y*MW+x;F[f].t[i]='door';F[f].fl[i]='wood';};
 const win=(f,x,y)=>{F[f].t[y*MW+x]='window';};
 const fu=(f,list,type,part)=>{list.forEach(([x,y],k)=>{F[f].fu[y*MW+x]={type,part:k,n:list.length,searched:false,item:null,id:f+'_'+x+'_'+y,group:f+'_'+list[0][0]+'_'+list[0][1]};});};
 // ---- floor 1
 room(0,1,1,10,8,'tile','Кухня');room(0,1,10,10,18,'wood','Столовая');room(0,12,1,23,10,'carpet','Гостиная');
 room(0,12,12,19,18,'wood','Прихожая');room(0,21,12,23,18,'tile','Ванная');room(0,25,1,30,18,'concrete','Гараж');
 [[5,9],[11,4],[11,15],[15,11],[16,11],[20,15],[24,5],[24,13]].forEach(([x,y])=>door(0,x,y));
 F[0].t[19*MW+15]='exit';F[0].t[19*MW+16]='exit';
 for(const [x,y] of [[3,0],[7,0],[15,0],[19,0],[0,4],[0,13],[0,16],[4,19],[8,19],[22,19]])win(0,x,y);
 for(let y=7;y<=12;y++)F[0].t[y*MW+31]='gate';
 F[0].t[12*MW+18]='stairs';F[0].t[12*MW+19]='stairs';
 fu(0,[[1,1],[2,1],[3,1]],'counter');fu(0,[[4,1],[5,1]],'counter');fu(0,[[6,1]],'stove');fu(0,[[8,1]],'fridge');fu(0,[[9,1],[10,1]],'counter');
 fu(0,[[4,4],[5,4],[4,5],[5,5]],'table');
 fu(0,[[4,13],[5,13],[6,13],[7,13],[4,14],[5,14],[6,14],[7,14]],'table');fu(0,[[1,11],[1,12]],'buffet');fu(0,[[10,18]],'plant');fu(0,[[1,17],[2,17]],'dresser');
 fu(0,[[14,3],[15,3],[16,3],[17,3]],'sofa');fu(0,[[15,1],[16,1]],'tv');fu(0,[[15,6],[16,6]],'table');fu(0,[[22,1],[23,1]],'shelf');fu(0,[[20,4]],'chair');fu(0,[[12,9]],'plant');fu(0,[[23,8],[23,9]],'shelf');
 fu(0,[[12,17]],'shoes');fu(0,[[12,13],[12,14]],'coats');
 fu(0,[[22,13],[23,13]],'bath');fu(0,[[21,17]],'toilet');fu(0,[[23,17]],'sinkc');
 fu(0,[[26,3],[27,3],[26,4],[27,4],[26,5],[27,5]],'car');fu(0,[[30,16]],'tools');fu(0,[[30,2],[30,3]],'shelf');fu(0,[[25,17],[26,17]],'boxes');fu(0,[[25,12]],'washer');
 // ---- floor 2
 room(1,1,1,9,7,'carpet','Твоя комната');room(1,11,1,20,7,'wood','Кабинет');room(1,22,1,30,7,'carpet','Спальня родителей');
 room(1,1,9,30,11,'wood','Коридор');room(1,16,12,19,14,'wood','Коридор');
 room(1,1,13,7,18,'tile','Ванная наверху');room(1,9,13,14,18,'wood','Кладовка');room(1,21,13,30,18,'carpet','Гостевая');
 [[5,8],[15,8],[26,8],[4,12],[11,12],[25,12]].forEach(([x,y])=>door(1,x,y));
 for(const [x,y] of [[3,0],[6,0],[14,0],[18,0],[25,0],[28,0],[4,19],[24,19],[28,19],[0,4],[0,10],[0,15],[31,4],[31,10],[31,15]])win(1,x,y);
 F[1].t[12*MW+18]='stairs';F[1].t[12*MW+19]='stairs';
 fu(1,[[2,2],[2,3]],'bed');fu(1,[[1,2]],'night');fu(1,[[7,1],[8,1]],'desk');fu(1,[[8,6],[9,6]],'wardrobe');fu(1,[[1,7]],'toybox');
 fu(1,[[13,2],[14,2]],'desk');fu(1,[[18,1],[19,1],[20,1]],'shelf');fu(1,[[11,1],[11,2]],'shelf');fu(1,[[20,6]],'chair');
 fu(1,[[25,2],[26,2],[25,3],[26,3]],'bed');fu(1,[[24,2]],'night');fu(1,[[27,2]],'night');fu(1,[[30,5],[30,6]],'dresser');fu(1,[[22,1],[23,1]],'wardrobe');
 fu(1,[[1,17],[2,17]],'bath');fu(1,[[6,13]],'aid');fu(1,[[7,17]],'toilet');fu(1,[[2,13]],'basket');
 fu(1,[[9,13],[10,13]],'shelf');fu(1,[[13,13],[14,13]],'boxes');fu(1,[[9,17],[10,17]],'boxes');fu(1,[[14,17]],'tools');
 fu(1,[[29,14],[29,15]],'bed');fu(1,[[30,16]],'night');fu(1,[[21,17],[22,17]],'wardrobe');fu(1,[[25,16],[26,16]],'table');
 fu(1,[[2,9]],'dresser');fu(1,[[30,9]],'plant');fu(1,[[9,11]],'plant');
 return F;
}
function tileAt(f,x,y){if(x<0||y<0||x>=MW||y>=MH)return'wall';return G.house[f].t[(y|0)*MW+(x|0)];}
function furnAt(f,x,y){if(x<0||y<0||x>=MW||y>=MH)return null;return G.house[f].fu[(y|0)*MW+(x|0)];}
const solidT=t=>t==='wall'||t==='window'||t==='exit'||t==='gate';
function blockedFor(f,x,y,crouch){const t=tileAt(f,x,y);if(solidT(t))return true;const u=furnAt(f,x,y);if(u&&!(crouch&&FURN[u.type].hide))return true;return false;}
function los(f,x0,y0,x1,y1){const d=Math.hypot(x1-x0,y1-y0);const n=Math.ceil(d*5);for(let i=1;i<n;i++){const t=i/n;if(solidT(tileAt(f,x0+(x1-x0)*t,y0+(y1-y0)*t)))return false;}return true;}
// BFS over both floors
function walkableE(f,i){const t=G.house[f].t[i];if(solidT(t))return false;return !G.house[f].fu[i];}
function bfs(sf,sx,sy,tf,tx,ty){
 const N=MW*MH;const prev=new Int32Array(2*N).fill(-1);const s=sf*N+(sy|0)*MW+(sx|0),t=tf*N+(ty|0)*MW+(tx|0);
 const q=new Int32Array(2*N);let h=0,e=0;q[e++]=s;prev[s]=s;
 while(h<e){const u=q[h++];if(u===t)break;const f=u>=N?1:0,i=u-f*N,x=i%MW,y=(i/MW)|0;
  const nb=[[x+1,y,f],[x-1,y,f],[x,y+1,f],[x,y-1,f]];
  if(G.house[f].t[i]==='stairs')nb.push([x,y,1-f]);
  for(const [nx,ny,nf] of nb){if(nx<0||ny<0||nx>=MW||ny>=MH)continue;const j=ny*MW+nx,v=nf*N+j;if(prev[v]!==-1||!walkableE(nf,j))continue;prev[v]=u;q[e++]=v;}}
 if(prev[t]===-1)return null;const path=[];let u=t;while(u!==s){path.push(u);u=prev[u];}path.reverse();
 return path.map(v=>{const f=v>=N?1:0,i=v-f*N;return{f,x:i%MW+.5,y:Math.floor(i/MW)+.5};});
}
function randomCell(f,filter){for(let k=0;k<300;k++){const x=1+Math.floor(rnd()*30),y=1+Math.floor(rnd()*18);const i=y*MW+x;if(walkableE(f,i)&&G.house[f].t[i]!=='stairs'&&(!filter||filter(x,y)))return{f,x:x+.5,y:y+.5};}return{f,x:15.5,y:10.5};}

/* ================= AUDIO ================= */
const A={ctx:null,on:true};
function aInit(){
 if(A.ctx)return;try{
  const a=new (window.AudioContext||window.webkitAudioContext)();A.ctx=a;const m=a.createGain();m.gain.value=.9;m.connect(a.destination);A.m=m;
  const len=a.sampleRate*2;const buf=a.createBuffer(1,len,a.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;A.nb=buf;
  // rain
  const rg=a.createGain();rg.gain.value=0;rg.connect(m);A.rain=rg;
  const rs=a.createBufferSource();rs.buffer=buf;rs.loop=true;const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=1200;const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=5000;rs.connect(hp);hp.connect(lp);lp.connect(rg);rs.start();
  // drone
  const dg=a.createGain();dg.gain.value=0;dg.connect(m);A.drone=dg;const dl=a.createBiquadFilter();dl.type='lowpass';dl.frequency.value=180;dl.connect(dg);
  for(const f of [41.2,43.6,61.7]){const o=a.createOscillator();o.type='sawtooth';o.frequency.value=f;const g=a.createGain();g.gain.value=.06;o.connect(g);g.connect(dl);o.start();}
  // chase
  const cg=a.createGain();cg.gain.value=0;cg.connect(m);A.chase=cg;const cf=a.createBiquadFilter();cf.type='lowpass';cf.frequency.value=600;cf.connect(cg);
  const o1=a.createOscillator();o1.type='square';o1.frequency.value=110;const o2=a.createOscillator();o2.type='square';o2.frequency.value=116.5;
  const g1=a.createGain();g1.gain.value=.12;o1.connect(g1);o2.connect(g1);g1.connect(cf);o1.start();o2.start();
  const tr=a.createOscillator();tr.frequency.value=7;const tg=a.createGain();tg.gain.value=.08;tr.connect(tg);tg.connect(g1.gain);tr.start();
 }catch(e){A.ctx=null;}

function nHit(freq,dur,vol,pan,type,q,delay){

function updateEnemy(e,dt){
 if(!e.active){if(G.time>e.delay){e.active=true;S.glass();msg(e.kind==='fox'?'Внизу разбилось стекло… В доме кто-то в маске':'Скрипнула задняя дверь. Пришёл Садовник',3.2,'#e0262f');}else return;}
 e.spotCD-=dt;
 const dx=G.x-e.x,dy=G.y-e.y,dist=Math.hypot(dx,dy);
 let canSee=false;
 if(e.f===G.f&&!G.hidden&&G.invuln<=0){
  const range=e.sight*(G.crouch?G.ch.crouchVis:1)*(G.lightning>0?1.3:1);
  if(dist<range&&los(e.f,e.x,e.y,G.x,G.y)){const fa=Math.abs(angDiff(e.ang,Math.atan2(dy,dx)));if(dist<1.6||fa<1.15||e.state==='chase')canSee=true;}
 }
 if(canSee){if(e.state!=='chase'&&e.spotCD<=0){if(e.killer){S.spot();msg(FOES[e.kind].name+' тебя видит! БЕГИ!',2,'#ff4a3d');}else{S.parent();msg(e.kind==='mom'?'Мама: «А ну стой! Почему не спишь?!»':'Папа: «Ты куда это '+gv('собралась','собрался')+'?!»',2,'#ffb347');}e.spotCD=7;}
  e.state='chase';e.lastSeen={f:G.f,x:G.x,y:G.y};e.lostT=0;}
 else if(e.state==='chase'){e.lostT+=dt;
  if(G.hidden&&e.lostT<.4&&dist<3&&!e.sawHide&&e.f===G.f&&e.killer){e.sawHide=true;}
  if(e.sawHide&&G.hidden){e.target={f:G.f,x:G.x,y:G.y};}
  else{e.target=e.lastSeen;if(e.lostT>.3&&(!e.path||e.lostT>4)){e.state='search';e.searchT=5;e.path=null;}}}
 if(e.sawHide&&!G.hidden)e.sawHide=false;
 if(!canSee&&e.state!=='chase'&&G.noise&&G.noise.f===e.f&&Math.hypot(G.noise.x-e.x,G.noise.y-e.y)<G.noise.r*e.hear){e.state='investigate';e.target={f:G.noise.f,x:G.noise.x,y:G.noise.y};e.path=null;e.searchT=3.5;}
 let speed=e.state==='chase'?e.run:e.state==='investigate'?e.walk*1.3:e.walk;
 let goal=null;
 if(e.state==='chase'&&canSee&&dist<2.2){goal={f:G.f,x:G.x,y:G.y};e.path=null;}
 else{
  if(e.state==='patrol'&&!e.target){if(e.idle>0){e.idle-=dt;speed=0;e.ang+=dt*.6;}else{e.target=pickPatrol(e);e.path=null;}}
  if(e.target){
   e.repath-=dt;
   if(!e.path||e.repath<=0){e.path=bfs(e.f,e.x,e.y,e.target.f,e.target.x,e.target.y);e.pi=0;e.repath=e.state==='chase'?.35:2;if(!e.path){e.target=null;e.state='patrol';}}
   if(e.path&&e.pi<e.path.length){goal=e.path[e.pi];
    if(goal.f!==e.f){e.f=goal.f;e.pi++;goal=e.path[e.pi]||null;}
    else if(Math.hypot(goal.x-e.x,goal.y-e.y)<.1){e.pi++;goal=e.path[e.pi]||null;if(goal&&goal.f!==e.f){e.f=goal.f;e.pi++;goal=e.path[e.pi]||null;}}}
   if(e.path&&e.pi>=e.path.length){
    if(e.state==='investigate'||e.state==='search'){e.searchT-=dt;speed=0;e.ang+=dt*2;if(e.searchT<=0){e.state='patrol';e.target=null;e.idle=.8;e.path=null;}}
    else if(e.state==='chase'&&!canSee&&!e.sawHide){e.state='search';e.searchT=4;e.path=null;}
    else if(e.state==='patrol'){e.target=null;e.idle=1+rnd()*2.5;e.path=null;}
    goal=null;
   }
  }
 }
 if(goal&&speed>0&&goal.f===e.f){
  const gx=goal.x-e.x,gy=goal.y-e.y,gl=Math.hypot(gx,gy)||1;const step=Math.min(gl,speed*dt);
  const nx=e.x+gx/gl*step,ny=e.y+gy/gl*step;
  if(!solidT(tileAt(e.f,nx,ny))){e.x=nx;e.y=ny;}
  e.ang+=angDiff(e.ang,Math.atan2(gy,gx))*Math.min(1,dt*8);e.bob+=dt*speed*4;
  e.stepT-=dt;if(e.stepT<=0){e.stepT=e.state==='chase'?.3:.5;const d2=Math.hypot(e.x-G.x,e.y-G.y);if(d2<14){const muff=e.f!==G.f;S.estep(clamp(1-d2/14,0,1)*(muff?.5:1)*(e.killer?1:.7),clamp((e.x-G.x)/6,-1,1),muff);}}
 }
 // catch
 if(e.f===G.f&&G.invuln<=0&&!G.scare&&dist<.62&&(!G.hidden||e.sawHide))caught(e);
}
function caught(e){
 G.search=null;G.crouch=false;G.hidden=false;
 if(e.killer){G.lives--;S.caught();G.scare={t:1.4,e};}
 else{S.parent();G.scare={t:1.6,e,parent:true};
  const have=G.diff.need.filter(id=>G.inv[id]);
  if(have.length){const id=have[Math.floor(rnd()*have.length)];delete G.inv[id];
   const conts=[];for(let f=0;f<2;f++)G.house[f].fu.forEach(u=>{if(u&&FURN[u.type].cont&&!u.item)conts.push(u);});
   const c=conts[Math.floor(rnd()*conts.length)];c.searched=false;setGroupItem(c.group,id);for(let f=0;f<2;f++)G.house[f].fu.forEach(u=>{if(u&&u.group===c.group)u.searched=false;});
   G.scare.lost=ITEMS[id].short;}
 }
}
function afterCatch(){
 const s=G.scare;G.scare=null;
 if(!s.parent&&G.lives<=0){loseGame();return;}
 G.f=1;G.x=5.5;G.y=4.5;G.ang=Math.PI/2;G.crouch=false;G.fade=.6;G.invuln=3.5;G.stamina=100;G.onStairs=false;
 if(s.parent){msg((s.e.kind==='mom'?'Мама':'Папа')+': «Марш в свою комнату!»',2.8,'#ffb347');if(s.lost)msg('Забрали '+s.lost+' и куда-то спрятали…',3,'#ffb347');
  s.e.state='patrol';s.e.target=null;s.e.idle=4;s.e.path=null;}
 else{msg('Ты '+gv('вырвалась','вырвался')+'! Осталось жизней: '+G.lives,3,'#ff7a6e');const c=randomCell(0,(x,y)=>x>20);Object.assign(s.e,{f:0,x:c.x,y:c.y,state:'patrol',target:null,path:null,idle:3,sawHide:false});}
}
function winGame(){G.end='win';S.win();let best=null;try{best=parseFloat(localStorage.getItem('pz_best_'+G.diff.id));if(!best||G.time<best)localStorage.setItem('pz_best_'+G.diff.id,String(G.time));}catch(e){}showEnd(true,!best||G.time<best,best);}

let RW=480,RH=270,view,vctx,img,u32,zbuf,cone,planeLen=.66;
function setupBuffers(){
 const aspect=W/H;RH=270;RW=Math.round(clamp(RH*aspect,300,640));planeLen=clamp(.375*RW/RH,.3,.9);
 view=document.createElement('canvas');view.width=RW;view.height=RH;vctx=view.getContext('2d');
 img=vctx.createImageData(RW,RH);u32=new Uint32Array(img.data.buffer);zbuf=new Float32Array(RW);cone=new Float32Array(RW*RH);
 for(let y=0;y<RH;y++)for(let x=0;x<RW;x++){const dx=(x-RW*.55)/(RH*.6),dy=(y-RH*.52)/(RH*.5);const r=dx*dx+dy*dy;cone[y*RW+x]=Math.max(0,1-r)*(1-r*.3)+Math.max(0,.22*(1-r/.1));}
}

scr.addEventListener('click',()=>{if(state==='play'&&!isTouch&&scr.requestPointerLock){try{const r=scr.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}}});
document.addEventListener('mousemove',e=>{if(state==='play'&&document.pointerLockElement===scr)mouseDX+=e.movementX||0;});
let hadLock=false;document.addEventListener('pointerlockchange',()=>{if(!document.pointerLockElement&&hadLock&&state==='play'&&G&&!G.end)pauseGame();hadLock=!!document.pointerLockElement;});
let lookT=null;scr.addEventListener('touchstart',e=>{const t=e.changedTouches[0];if(t.clientX>W*.35&&t.clientX<W*.7)lookT={id:t.identifier,x:t.clientX};},{passive:true});
window.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(lookT&&t.identifier===lookT.id){mouseDX+=(t.clientX-lookT.x)*2.5;lookT.x=t.clientX;}},{passive:true});
window.addEventListener('touchend',e=>{for(const t of e.changedTouches)if(lookT&&t.identifier===lookT.id)lookT=null;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pauseGame();});
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;
 b.addEventListener('touchstart',e=>{e.preventDefault();keys[k]=true;b.classList.add('on');},{passive:false});
 const off=e=>{e.preventDefault();keys[k]=false;b.classList.remove('on');};b.addEventListener('touchend',off,{passive:false});b.addEventListener('touchcancel',off,{passive:false});});
document.querySelectorAll('#acts button').forEach(b=>{const a=b.dataset.a;
 b.addEventListener('touchstart',e=>{e.preventDefault();b.classList.add('on');if(state!=='play')return;if(a==='C')toggleCrouch();if(a==='E')interact();if(a==='run')touch.run=true;if(a==='P')pauseGame();},{passive:false});
 b.addEventListener('touchend',e=>{e.preventDefault();b.classList.remove('on');if(a==='run')touch.run=false;},{passive:false});});
function showTouch(on){document.getElementById('touch').style.display=on&&isTouch?'block':'none';}

/* ================= MENUS ================= */
const menu=document.getElementById('menu'),mi=document.getElementById('mi');
function portrait(ch,w,h){const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.scale(2,2);
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#251a22');gr.addColorStop(1,'#0c090c');g.fillStyle=gr;g.fillRect(0,0,w,h);
 g.fillStyle='rgba(255,200,120,.08)';g.beginPath();g.arc(w/2,h*.5,h*.45,0,TAU);g.fill();
 g.save();g.translate(w/2,h*.62);g.scale(h*.95,h*.95);drawPerson(g,{body:ch.shirt,skin:ch.skin,hair:ch.hair,style:ch.style,glasses:ch.glasses});g.restore();return c;}
function foeIcon(kind){const c=document.createElement('canvas');c.width=112;c.height=112;const g=c.getContext('2d');g.fillStyle='#0c090c';g.fillRect(0,0,112,112);g.drawImage(TX['e_'+kind][0].canvas,0,0,128,128,0,4,112,112);return c;}
function show(screen){
 state='menu';if(document.pointerLockElement)document.exitPointerLock();menu.hidden=false;showTouch(false);let h='';
 if(screen==='title'){
  h=`<p class="tag">вид от первого лица · гроза · телефон звонит в полночь</p>
  <h1 class="logo">Полночный<span>звонок</span></h1>
  <p class="story">Ночь, гроза, родители злятся и запрещают выходить из комнаты. Вдруг звонит телефон: «Двери заперты. Найди, чем их открыть…» Внизу бьётся стекло: в доме кто-то в маске. Обыщи шкафы, тумбочки и ящики на обоих этажах, собери всё нужное и выберись через входную дверь. <span class="age">12+</span></p>
  <div class="foes" id="foes"></div>
  <div class="keys">
   <div class="key"><kbd>↑</kbd><kbd>↓</kbd> идти вперёд и назад</div>
   <div class="key"><kbd>←</kbd><kbd>→</kbd> поворачиваться (или мышь)</div>
   <div class="key"><kbd>A</kbd><kbd>D</kbd> шаг в сторону</div>
   <div class="key"><kbd>C</kbd> сесть / встать, залезть под кровать или стол</div>
   <div class="key"><kbd>E</kbd> или <kbd>Пробел</kbd> обыскать, открыть дверь</div>
   <div class="key"><kbd>Shift</kbd> бежать (громко!)</div>
   <div class="key">Лестница в прихожей и коридоре ведёт между этажами</div>
   <div class="key"><kbd>Esc</kbd> пауза</div>
  </div>
  <div class="row"><button class="btn primary" id="go">Начать</button><span class="meta">Лучше играть в наушниках</span></div>`;
 }else if(screen==='char'){
  h=`<h2>Кто остался дома?</h2><div class="grid" id="chars"></div><div class="row"><button class="btn" id="back">Назад</button><button class="btn primary" id="next">Дальше</button></div>`;
 }else if(screen==='diff'){
  h=`<h2>Уровень сложности</h2><div class="grid d3" id="diffs"></div><div class="row"><button class="btn" id="back">Назад</button><button class="btn primary" id="start">Ответить на звонок</button></div>`;
 }
 mi.innerHTML=h;const on=(id,f)=>{const el=document.getElementById(id);if(el)el.onclick=f;};
 if(screen==='title'){const fb=document.getElementById('foes');['fox','gardener','mom','dad'].forEach(k=>{const d=document.createElement('div');d.className='foe';d.appendChild(foeIcon(k));d.insertAdjacentHTML('beforeend',`<div><b>${FOES[k].name}</b><span>${FOES[k].desc}</span></div>`);fb.appendChild(d);});
  on('go',()=>{aInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();show('char');});}
 if(screen==='char'){const box=document.getElementById('chars');CHARS.forEach((ch,i)=>{const b=document.createElement('button');b.className='card'+(sel.ch===i?' sel':'');b.appendChild(portrait(ch,220,150));
  b.insertAdjacentHTML('beforeend',`<div class="nm">${ch.name}</div><div class="role">${ch.role}</div><div class="meta">${ch.desc}</div>`);b.onclick=()=>{sel.ch=i;show('char');};b.ondblclick=()=>{sel.ch=i;show('diff');};box.appendChild(b);});
  on('back',()=>show('title'));on('next',()=>show('diff'));}
 if(screen==='diff'){const box=document.getElementById('diffs');DIFFS.forEach((d,i)=>{const b=document.createElement('button');b.className='card'+(sel.diff===i?' sel':'');
  let best='';try{const v=parseFloat(localStorage.getItem('pz_best_'+d.id));if(v)best=`<span>Рекорд</span><b>${fmt(v)}</b>`;}catch(e){}
  b.innerHTML=`<div class="nm" style="color:${['#6be38f','#ffb347','#e0262f'][i]}">${d.name}</div><div class="meta">${d.note}</div>
  <div class="dl"><span>Найти</span><b>${d.need.map(id=>ITEMS[id].short).join(', ')}</b><span>Жизней</span><b>${d.lives}</b><span>Враги</span><b>${['родители + маска лиса','родители + 2 убийцы','все, и они быстрее'][i]}</b><span>Убийцы придут</span><b>${['через 30 секунд','через 18 секунд','почти сразу'][i]}</b>${best}</div>`;
  b.onclick=()=>{sel.diff=i;show('diff');};b.ondblclick=()=>{sel.diff=i;startGame();};box.appendChild(b);});
  on('back',()=>show('char'));on('start',startGame);}
}
function startGame(){aInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();newGame();state='play';menu.hidden=true;showTouch(true);lockMouse();}
function lockMouse(){if(!isTouch&&scr.requestPointerLock){try{const r=scr.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(e){}}}
function pauseGame(){if(state!=='play'||!G||G.end)return;state='pause';if(document.pointerLockElement)document.exitPointerLock();showTouch(false);for(const k in keys)keys[k]=false;if(A.ctx)A.chase.gain.setTargetAtTime(0,A.ctx.currentTime,.1);menu.hidden=false;
 mi.innerHTML=`<h1 class="big">Пауза</h1><p class="story">${G.ch.name} · ${G.diff.name} · найдено ${G.diff.need.filter(i=>G.inv[i]).length} из ${G.diff.need.length} · ${fmt(G.time)}</p>
 <div class="row"><button class="btn primary" id="res">Продолжить</button><button class="btn" id="snd">Звук: ${A.on?'вкл':'выкл'}</button><button class="btn" id="rst">Заново</button><button class="btn" id="mn">В меню</button></div>`;
 document.getElementById('res').onclick=()=>{state='play';menu.hidden=true;showTouch(true);lockMouse();};
 document.getElementById('snd').onclick=e=>{A.on=!A.on;e.target.textContent='Звук: '+(A.on?'вкл':'выкл');if(A.ctx&&!A.on){A.rain.gain.value=0;A.drone.gain.value=0;}};
 document.getElementById('rst').onclick=startGame;document.getElementById('mn').onclick=()=>{G=null;show('title');};}
function showEnd(win,rec,best){state='end';showTouch(false);if(document.pointerLockElement)document.exitPointerLock();if(A.ctx)A.chase.gain.setTargetAtTime(0,A.ctx.currentTime,.1);
 setTimeout(()=>{menu.hidden=false;
  mi.innerHTML=win?`<p class="tag">цепь упала, дверь распахнулась, а за ней дождь и свобода</p><h1 class="big" style="color:var(--ok)">Ты ${gv('выбралась','выбрался')}!</h1>
   <p class="story">${G.ch.name} выбегает под дождь к соседям. Позади тёмный дом и чей-то силуэт в окне… Сложность: ${G.diff.name}. Время: <b>${fmt(G.time)}</b>${rec?', новый рекорд!':best?' (рекорд '+fmt(best)+')':''}.</p>
   <div class="row"><button class="btn primary" id="again">Ещё раз</button><button class="btn" id="b2">${sel.diff<2?'Сложнее':'Другой герой'}</button><button class="btn" id="mn">В меню</button></div>`
  :`<p class="tag" style="color:var(--red)">звонок оборвался</p><h1 class="big" style="color:var(--red)">Тебя поймали</h1>
   <p class="story">Найдено ${G.diff.need.filter(i=>G.inv[i]).length} из ${G.diff.need.length}. Совет: садись (C) и ползи, когда враг рядом, тогда шагов не слышно. Под кроватью и столом не найдут, если не видели, как ты туда ${gv('залезла','залез')}.</p>
   <div class="row"><button class="btn primary" id="again">Попробовать снова</button><button class="btn" id="b2">Сменить героя</button><button class="btn" id="mn">В меню</button></div>`;
  document.getElementById('again').onclick=startGame;
  document.getElementById('b2').onclick=()=>{if(win&&sel.diff<2){sel.diff++;startGame();}else{G=null;show('char');}};
  document.getElementById('mn').onclick=()=>{G=null;show('title');};},win?700:300);}
resize();buildTextures();show('title');requestAnimationFrame(frame);
window.__g={get G(){return G;},sel,startGame,update,keys,interact,toggleCrouch};
</script>
