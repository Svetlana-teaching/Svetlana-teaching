<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON RUSH — ночные гонки</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
  #app canvas { display: block; }
  .hidden { display: none !important; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

  /* ---------- Меню ---------- */
  #menu { background: linear-gradient(90deg, rgba(8,4,20,.92) 0%, rgba(8,4,20,.55) 45%, rgba(8,4,20,0) 70%); align-items: flex-start; padding-left: 7vw; }
  .logo { font-size: clamp(48px, 8vw, 104px); font-weight: 900; font-style: italic; letter-spacing: -2px; line-height: .9;
          background: linear-gradient(90deg, #22e6ff, #ff2bd6); -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 0 18px rgba(255,43,214,.55)); }
  .sub { font-size: 18px; letter-spacing: 8px; margin: 10px 0 34px 4px; color: #c9c2ff; }
  .label { font-size: 13px; letter-spacing: 3px; color: #8f88b8; margin: 18px 0 10px; }
  .row { display: flex; gap: 12px; }
  .swatch { width: 44px; height: 44px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; box-shadow: inset 0 -8px 14px rgba(0,0,0,.4); transition: .15s; }
  .swatch.sel { border-color: #fff; transform: scale(1.12); box-shadow: 0 0 18px rgba(255,255,255,.5); }
  .diff, .btn { cursor: pointer; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff;
                padding: 10px 20px; font-size: 15px; font-weight: 700; letter-spacing: 1px; transform: skewX(-12deg); transition: .15s; }
  .diff.sel { background: #22e6ff; color: #05121a; border-color: #22e6ff; box-shadow: 0 0 16px #22e6ff; }
  .btn.big { margin-top: 38px; font-size: 26px; padding: 16px 64px; background: linear-gradient(90deg, #ff2bd6, #7a2cff); border: none; box-shadow: 0 0 30px rgba(255,43,214,.6); }
  .btn:hover { filter: brightness(1.2); }
  .controls { margin-top: 30px; font-size: 13px; line-height: 1.9; color: #b8b2d8; }
  .controls b { display: inline-block; min-width: 26px; padding: 0 6px; margin-right: 6px; border: 1px solid #5a5480; border-radius: 4px; text-align: center; color: #fff; font-size: 12px; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; background: linear-gradient(180deg, rgba(10,6,24,.65), rgba(10,6,24,.35)); border-left: 3px solid #ff2bd6; padding: 8px 16px; transform: skewX(-10deg); }
  .panel > * { transform: skewX(10deg); }
  #posBox { top: 22px; left: 26px; }
  #pos { font-size: 64px; font-weight: 900; font-style: italic; line-height: 1; }
  #pos span { font-size: 28px; color: #9f98c8; }
  #lapBox { top: 22px; right: 26px; text-align: right; border-left: none; border-right: 3px solid #22e6ff; min-width: 210px; }
  .k { font-size: 11px; letter-spacing: 3px; color: #9f98c8; }
  .v { font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  #gaugeBox { position: absolute; right: 22px; bottom: 16px; width: 240px; }
  #gauge { width: 240px; height: 240px; }
  #nitro { position: absolute; right: 36px; bottom: 14px; width: 210px; height: 10px; background: rgba(255,255,255,.12); transform: skewX(-20deg); }
  #nitroFill { height: 100%; width: 100%; background: linear-gradient(90deg, #2a7bff, #22e6ff); box-shadow: 0 0 12px #22e6ff; }
  #nitroLbl { position: absolute; right: 252px; bottom: 10px; font-size: 12px; letter-spacing: 3px; color: #22e6ff; font-weight: 700; }
  #minimap { position: absolute; left: 22px; bottom: 22px; width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(rgba(10,6,24,.75), rgba(10,6,24,.45)); border: 2px solid rgba(34,230,255,.4); }
  #count { position: absolute; top: 32%; width: 100%; text-align: center; font-size: 160px; font-weight: 900; font-style: italic; text-shadow: 0 0 40px #ff2bd6; }
  #count.go { color: #22e6ff; text-shadow: 0 0 40px #22e6ff; font-size: 120px; }
  #flash { position: absolute; top: 20%; width: 100%; text-align: center; font-size: 46px; font-weight: 900; font-style: italic; letter-spacing: 2px; opacity: 0; text-shadow: 0 0 24px #ff2bd6; }
  #flash.show { animation: fl 2.2s ease-out; }
  @keyframes fl { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; } }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }

  /* ---------- Финиш / пауза ---------- */
  .card { background: rgba(10,6,24,.88); border: 1px solid rgba(255,43,214,.5); padding: 34px 48px; box-shadow: 0 0 40px rgba(255,43,214,.35); text-align: center; min-width: 380px; }
  .card h1 { font-size: 54px; font-style: italic; font-weight: 900; margin-bottom: 18px; background: linear-gradient(90deg,#22e6ff,#ff2bd6); -webkit-background-clip: text; background-clip: text; color: transparent; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; margin-bottom: 20px; }
  td { padding: 7px 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,.08); font-variant-numeric: tabular-nums; }
  td:last-child { text-align: right; }
  tr.me td { color: #22e6ff; font-weight: 800; }
  tr.bestrow td { color: #c9c2ff; font-size: 15px; border: none; padding-top: 14px; }
  .card .btn { margin: 0 6px; }

  /* ---------- Сенсорные кнопки ---------- */
  #touch { position: fixed; inset: 0; pointer-events: none; }
  #touch button { pointer-events: auto; position: absolute; width: 74px; height: 74px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); background: rgba(255,255,255,.1); color: #fff; font-size: 24px; font-weight: 800; touch-action: none; }
  @media (pointer: fine) { #touch { display: none; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="vignette"></div>

<div id="menu" class="overlay">
  <div class="logo">NEON<br>RUSH</div>
  <div class="sub">НОЧНЫЕ ГОНКИ</div>
  <div class="label">ЦВЕТ МАШИНЫ</div>
  <div class="row">
    <div class="swatch sel" data-c="d8102a" style="background:#d8102a"></div>
    <div class="swatch" data-c="1667ff" style="background:#1667ff"></div>
    <div class="swatch" data-c="ffb21a" style="background:#ffb21a"></div>
    <div class="swatch" data-c="15b86a" style="background:#15b86a"></div>
    <div class="swatch" data-c="f0f0f0" style="background:#f0f0f0"></div>
    <div class="swatch" data-c="16161c" style="background:#16161c;border-color:#444"></div>
  </div>
  <div class="label">СЛОЖНОСТЬ</div>
  <div class="row">
    <button class="diff" data-d="easy">ЛЕГКО</button>
    <button class="diff sel" data-d="normal">НОРМА</button>
    <button class="diff" data-d="hard">ЖЁСТКО</button>
  </div>
  <button id="startBtn" class="btn big">СТАРТ</button>
  <div class="controls">
    <b>↑</b>газ &nbsp; <b>↓</b>тормоз &nbsp; <b>← →</b>руль<br>
    <b>ПРОБЕЛ</b>ручник (занос) &nbsp; <b>SHIFT</b>нитро<br>
    <b>R</b>вернуться на трассу &nbsp; <b>P</b>пауза &nbsp; <b>M</b>звук
  </div>
</div>

<div id="hud" class="hidden">
  <div id="posBox" class="panel"><div><div class="k">ПОЗИЦИЯ</div><div id="pos">6<span>/6</span></div></div></div>
  <div id="lapBox" class="panel"><div>
    <div class="k">КРУГ</div><div class="v" id="lap">1/3</div>
    <div class="k" style="margin-top:6px">ВРЕМЯ</div><div class="v" id="time">0:00.00</div>
    <div class="k" style="margin-top:6px">ЛУЧШИЙ КРУГ</div><div class="v" id="best" style="font-size:18px">--:--.--</div>
  </div></div>
  <canvas id="minimap" width="200" height="200"></canvas>
  <div id="gaugeBox"><canvas id="gauge" width="240" height="240"></canvas></div>
  <div id="nitroLbl">НИТРО</div>
  <div id="nitro"><div id="nitroFill"></div></div>
  <div id="count"></div>
  <div id="flash"></div>
</div>

<div id="pause" class="overlay hidden"><div class="card"><h1>ПАУЗА</h1><button id="resumeBtn" class="btn">ПРОДОЛЖИТЬ</button></div></div>

<div id="finish" class="overlay hidden">
  <div class="card">
    <h1 id="finishTitle">ПОБЕДА!</h1>
    <table id="results"></table>
    <button id="againBtn" class="btn">ЕЩЁ РАЗ</button>
    <button id="menuBtn" class="btn">МЕНЮ</button>
  </div>
</div>

<div id="touch">
  <button data-key="ArrowLeft" style="left:24px;bottom:150px">◀</button>
  <button data-key="ArrowRight" style="left:112px;bottom:150px">▶</button>
  <button data-key="ArrowUp" style="right:24px;bottom:260px">▲</button>
  <button data-key="ArrowDown" style="right:112px;bottom:260px">▼</button>
  <button data-key="ShiftLeft" style="right:200px;bottom:260px;font-size:14px">N₂O</button>
  <button data-key="Space" style="right:288px;bottom:260px;font-size:14px">⟲</button>
</div>
